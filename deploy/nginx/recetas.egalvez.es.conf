# /etc/nginx/conf.d/recetas.egalvez.es.conf
#
# Vhost de recetas.egalvez.es. Lo sirve el MISMO proceso Django que
# tension.egalvez.es: HostRoutingMiddleware elige el urlconf según el host.
#
# Antes de activarlo, AJUSTA:
#   1. La ruta de los certificados wildcard (*.egalvez.es).
#   2. El bloque "upstream": cópialo del vhost de tensión (mismo socket/puerto
#      de gunicorn/uvicorn). Si ya existe un upstream con ese nombre en el vhost
#      de tensión, borra el de aquí para no declararlo dos veces.
#   3. Las rutas de /static/ y /media/ (STATIC_ROOT y MEDIA_ROOT del .env).

upstream tension_app {
    # Mismo destino que usa tension.egalvez.es (socket unix o puerto local)
    server unix:/run/tension/gunicorn.sock fail_timeout=0;
    # server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name recetas.egalvez.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recetas.egalvez.es;

    # Certificado wildcard *.egalvez.es (ajusta la ruta)
    ssl_certificate     /etc/letsencrypt/live/egalvez.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/egalvez.es/privkey.pem;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fotos de recetas: debe coincidir con DATA_UPLOAD_MAX_MEMORY_SIZE (25 MB) + margen
    client_max_body_size 30m;

    access_log /var/log/nginx/recetas.access.log;
    error_log  /var/log/nginx/recetas.error.log;

    location = /favicon.ico {
        alias /var/www/tension/collectstatic/imagenes/logo.ico;
        access_log off;
    }

    location /static/ {
        alias /var/www/tension/collectstatic/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/tension/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        # Contenido subido por usuarios: nunca servir nada ejecutable o HTML/SVG
        # (evita XSS almacenado). Solo imágenes y vídeo.
        location ~* \.(html?|svg|svgz|xml|js|php|py|sh|pl|cgi)$ {
            return 403;
        }
    }

    location / {
        proxy_pass http://tension_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
